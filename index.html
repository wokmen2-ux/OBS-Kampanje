<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obs Bygg Kampanjeplanlegger – Logg inn</title>
<script>
// ============================================================
// BRUKERE – endre brukernavn og passord her.
// Nøkkelen (skien / sandefjord) må samsvare med mappenavnet.
// Nytt varehus: kopier en linje, og legg appen i en mappe med samme navn.
// ============================================================
const AVDELINGER = {
  skien:      { navn: 'Skien',      brukernavn: 'Skien',      passord: '5087' },
  sandefjord: { navn: 'Sandefjord', brukernavn: 'Sandefjord', passord: '3571' },
  kongsberg:  { navn: 'Kongsberg',  brukernavn: 'Kongsberg',  passord: '3570' }
};

// Allerede logget inn på denne maskinen? Gå rett til riktig app.
(function(){
  try{
    const a = localStorage.getItem('obsbygg_avdeling');
    if (a && AVDELINGER[a]) location.replace(a + '/index.html');
  }catch(e){}
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;800&family=Barlow:wght@400;500;600&display=swap');
:root{
  --obs-blue:#003A70;--obs-blue-mid:#005BAC;--obs-blue-light:#0077CC;
  --obs-blue-pale:#E8F3FB;--obs-red:#E30613;
  --white:#FFFFFF;--gray-200:#D8E2EF;--gray-400:#8EA3BE;--gray-600:#4A6080;--gray-900:#0D1F33;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--obs-blue);color:var(--gray-900);
  display:flex;align-items:center;justify-content:center;padding:24px;
  background-image:
    radial-gradient(circle at 85% 15%, rgba(0,119,204,.55) 0, transparent 45%),
    linear-gradient(160deg,#003A70 0%,#002B54 100%);
}
.wrap{width:100%;max-width:400px;}
.brand{color:var(--white);margin-bottom:28px;}
.brand-obs{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:800;font-size:52px;line-height:.9;letter-spacing:1px;}
.brand-app{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:400;font-size:22px;opacity:.85;margin-top:6px;}
.card{background:var(--white);border-radius:14px;padding:28px;box-shadow:0 16px 48px rgba(0,0,0,.25);}
.card h1{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:26px;color:var(--obs-blue);}
.card p{font-size:14px;color:var(--gray-600);margin:4px 0 22px;}
label{display:block;font-size:13px;font-weight:600;color:var(--gray-600);margin-bottom:6px;}
input{
  width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--gray-200);
  border-radius:8px;margin-bottom:16px;color:var(--gray-900);background:var(--white);
}
input:focus{outline:none;border-color:var(--obs-blue-light);box-shadow:0 0 0 3px rgba(0,119,204,.18);}
button{
  width:100%;font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;font-size:19px;letter-spacing:.5px;
  background:var(--obs-blue);color:var(--white);border:none;border-radius:8px;padding:13px;cursor:pointer;margin-top:4px;
}
button:hover{background:var(--obs-blue-mid);}
button:focus-visible{outline:3px solid var(--obs-blue-light);outline-offset:2px;}
.error{display:none;background:#FDECEC;color:#A3101A;border-left:3px solid var(--obs-red);
  font-size:14px;padding:10px 12px;border-radius:6px;margin-bottom:16px;}
.error.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-obs">OBS BYGG</div>
    <div class="brand-app">Kampanjeplanlegger</div>
  </div>
  <form class="card" id="login" novalidate>
    <h1>Logg inn</h1>
    <p>Bruk brukernavnet til ditt varehus.</p>
    <div class="error" id="error" role="alert">Feil brukernavn eller passord. Prøv igjen.</div>
    <label for="user">Brukernavn</label>
    <input id="user" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="pass">Passord</label>
    <input id="pass" type="password" autocomplete="current-password" inputmode="numeric" required>
    <button type="submit">Logg inn</button>
  </form>
</div>
<script>
document.getElementById('login').addEventListener('submit', function(e){
  e.preventDefault();
  const u = document.getElementById('user').value.trim().toLowerCase();
  const p = document.getElementById('pass').value;
  const treff = Object.keys(AVDELINGER).find(k =>
    AVDELINGER[k].brukernavn.toLowerCase() === u && AVDELINGER[k].passord === p);
  if (!treff){
    document.getElementById('error').classList.add('show');
    document.getElementById('pass').value = '';
    document.getElementById('pass').focus();
    return;
  }
  try{ localStorage.setItem('obsbygg_avdeling', treff); }catch(err){}
  location.href = treff + '/index.html';
});
</script>
</body>
</html>
